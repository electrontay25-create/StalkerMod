name: Compilar Stalker Mod

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Descargar codigo
      uses: actions/checkout@v3

    - name: Configurar Java 17 y Gradle
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'
        gradle-version: '8.2'

    - name: Compilar Mod (.jar)
      run: gradle build

    - name: Guardar archivo .jar compilado
      uses: actions/upload-artifact@v3
      with:
        name: StalkerMod-JAR
        path: build/libs/*.jar
